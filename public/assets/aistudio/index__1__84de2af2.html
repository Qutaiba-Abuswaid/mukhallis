    // ============================================================================
    // 3. CALCULATION LOGIC FOR TENURE, SETTLEMENT (QIWA-ALIGNED) & LEAVE ACCRUAL
    // ============================================================================
    function calculateTenure(hireDateStr, endDateStr) {
      const start = new Date(hireDateStr);
      const end = new Date(endDateStr);
      if (isNaN(start.getTime()) || isNaN(end.getTime()) || end < start) {
        return {
          years: 0,
          months: 0,
          days: 0,
          totalYearsExact: 0,
          totalYears365: 0,
          totalMonths: 0,
          totalDays: 0
        };
      }

      const diffMs = end.getTime() - start.getTime();
      const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const totalYears365 = totalDays / 365;
      const totalMonths = totalDays / 30.4167;

      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonthDate = new Date(end.getFullYear(), end.getMonth(), 0);
        days += prevMonthDate.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalYearsExact = Math.max(0, years) + (Math.max(0, months) / 12) + (Math.max(0, days) / 365);

      return {
        years: Math.max(0, years),
        months: Math.max(0, months),
        days: Math.max(0, days),
        totalYearsExact,
        totalYears365,
        totalMonths,
        totalDays
      };
    }

    function calculateSaudiGratuityByYears(yearsValue, baseWage) {
      const yrs = Math.max(0, Number(yearsValue) || 0);
      const firstFiveYears = Math.min(yrs, 5);
      const afterFiveYears = Math.max(0, yrs - 5);
      return (firstFiveYears * 0.5 * baseWage) + (afterFiveYears * 1.0 * baseWage);
    }

    function getRecommendedNoticeDaysForSaudi(contractType, terminationType) {
      if (contractType !== 'indefinite') return 0;
      if (
        terminationType === 'qiwa_art75' ||
        terminationType === 'qiwa_resignation' ||
        terminationType === 'resignation'
      ) {
        return 60;
      }
      return 0;
    }

    function calculateSettlement(s) {
      const tenure = calculateTenure(s.hireDate, s.endDate);
      const basic = Math.max(0, Number(s.basicSalary) || 0);
      const fixedAllow = Math.max(0, Number(s.fixedAllowances) || 0);
      const excludedAllow = Math.max(0, Number(s.excludedAllowances) || 0);
      const commTotal12M = Math.max(0, Number(s.twelveMonthCommissionsTotal) || 0);
      const monthsDivisor = tenure.totalMonths > 0 && tenure.totalMonths < 12 ? tenure.totalMonths : 12;
      const avgMonthlyCommission = commTotal12M / monthsDivisor;

      // Settlement base wage = basic salary + fixed allowances + average monthly commission
      const settlementBaseWage = basic + fixedAllow + avgMonthlyCommission;
      const dailyWage = settlementBaseWage / 30;

      const remainingLeave = Math.max(0, Number(s.remainingLeaveDays) || 0);
      const leavePayout = remainingLeave * dailyWage;
      const unpaidSal = Math.max(0, Number(s.unpaidSalary) || 0);
      const loanBal = Math.max(0, Number(s.loanBalance) || 0);
      const customArt77 = Math.max(0, Number(s.art77CompensationAmount) || 0);

      const isSaudiLaw = s.law === 'saudi_citizen' || s.law === 'saudi_expat';
      let gratuity = 0;
      let noticeAmount = 0;
      let compensationAmount = 0;
      let lawNote = '';

      if (isSaudiLaw) {
        const isExpat = s.law === 'saudi_expat';
        const categoryLabel = isExpat ? 'للعامل غير السعودي' : 'للعامل السعودي';
        const contractType = s.saudiContractType === 'indefinite' ? 'indefinite' : 'fixed_term';
        const contractLabel = contractType === 'indefinite' ? 'عقد غير محدد المدة' : 'عقد محدد المدة';
        const noticeDays = Math.max(0, Number(s.noticeDays) || 60);

        // Qiwa-aligned exact service tenure (years + months/12 + days/365)
        const yrs = tenure.totalYearsExact;
        const rawGratuity = calculateSaudiGratuityByYears(yrs, settlementBaseWage);

        if (s.applyNoticePay && noticeDays > 0) {
          noticeAmount = (settlementBaseWage / 30) * noticeDays;
        }

        switch (s.terminationType) {
          case 'qiwa_art74_1':
            gratuity = rawGratuity;
            lawNote = `اتفاق الطرفين على إنهاء العقد (المادة 74/1 - قوى) [${contractLabel}]: يستحق ${categoryLabel} مكافأة نهاية الخدمة كاملة (${yrs.toFixed(2)} سنة).`;
            break;

          case 'qiwa_art74_2':
            gratuity = rawGratuity;
            if (contractType === 'indefinite') {
              lawNote = `تنبيه قوى: اخترت "انتهاء مدة العقد المحددة (المادة 74/2)" مع تحديد نوع العقد كـ "غير محدد المدة". يُحتسب الأجر المعتاد للمكافأة (${yrs.toFixed(2)} سنة)، ويُفضّل مطابقة نوع العقد وسبب الإنهاء في قوى.`;
            } else {
              lawNote = `انتهاء مدة العقد المحددة (المادة 74/2 - قوى) [${contractLabel}]: يستحق ${categoryLabel} مكافأة نهاية الخدمة كاملة عن كامل مدة الخدمة دون خصم استقالة أو بدل إشعار ما لم يُتفق على خلاف ذلك.`;
            }
            break;

          case 'qiwa_art75':
            gratuity = rawGratuity;
            lawNote = `إنهاء العقد غير محدد المدة بإرادة صاحب العمل لسبب مشروع (المادة 75 - قوى) [${contractLabel}]: يستحق ${categoryLabel} مكافأة نهاية الخدمة كاملة مع مراعاة مهلة الإشعار النظامية (${noticeDays} يوماً).`;
            break;

          case 'qiwa_art77_employer':
            gratuity = rawGratuity;

    const MONTH_NAMES_AR = [
      'يناير (1)', 'فبراير (2)', 'مارس (3)', 'أبريل (4)',
      'مايو (5)', 'يونيو (6)', 'يوليو (7)', 'أغسطس (8)',

    function calculateLeaveSimulation(sim) {
      const annual = Math.max(0, Number(sim.annualEntitlement) || 0);
      const taken = Math.max(0, Number(sim.takenDays) || 0);
      const monthIdx = Math.min(12, Math.max(1, Number(sim.currentMonth) || 1));
      const dayOfMonth = Math.min(31, Math.max(1, Number(sim.currentDayOfMonth) || 1));

      const monthlyAccrual = annual / 12;
      const currentMonthFraction = Math.min(1, dayOfMonth / 30);
      const accruedUpToDate = ((monthIdx - 1) * monthlyAccrual) + (currentMonthFraction * monthlyAccrual);
      const accruedEndOfSelectedMonth = monthIdx * monthlyAccrual;

      const remainingAsOfDate = accruedUpToDate - taken;
      const remainingEndOfYear = annual - taken;

      const schedule = [];
      for (let m = 1; m <= 12; m++) {
        const cumulativeAccrued = m * monthlyAccrual;
        const remainingAfterTaken = cumulativeAccrued - taken;
        schedule.push({
          month: m,
          label: MONTH_NAMES_AR[m - 1],
          monthlyAccrual,
          cumulativeAccrued,
          taken,
          remainingAfterTaken
        });
      }

      return {
        annual,
        taken,
        monthIdx,
        dayOfMonth,
        monthlyAccrual,
        accruedUpToDate,
        accruedEndOfSelectedMonth,
        remainingAsOfDate,
        remainingEndOfYear,
        schedule
      };
    }

    }

    }

    function getDueMorningNotes(includeAllActiveForPreview = false) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const currentHM = `${hh}:${mm}`;
      const todayStr = now.toISOString().slice(0, 10);

      return state.employees.filter((emp) => {
        if (!emp.reminderActive || !emp.note || !emp.note.trim()) return false;
        if (includeAllActiveForPreview) return true;
        const targetTime = emp.reminderTime || '08:30';
        return currentHM >= targetTime && emp.lastNotifiedDate !== todayStr;
      });
    }

    function triggerBrowserNotification(notesList) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const bodyText = notesList
          .slice(0, 4)
          .map((n) => `• ${n.name} (${LAW_PROFILES[n.law]?.shortName || ''}): ${n.note}`)
          .join('\n');
        new Notification('مُخلّص HR — تنبيه الملاحظات الصباحية (08:30 ص)', {
          body: bodyText || 'لديك ملاحظات موظفين مجدولة لليوم.',
          dir: 'rtl'
        });
      } catch (e) {
        console.warn('Notification display skipped:', e);
      }
    }

    function checkScheduledReminders() {
      const due = getDueMorningNotes(false);
      if (due.length > 0) {
        const todayStr = new Date().toISOString().slice(0, 10);
        state.employees = state.employees.map((emp) =>
          due.some((d) => d.id === emp.id) ? { ...emp, lastNotifiedDate: todayStr } : emp
        );
        saveState();
        state.morningAlertOpen = true;
        state.simulatedAlert = false;
        triggerBrowserNotification(due);
        render();
      }
    }

    function parseImportedData(text) {
      const trimmed = text.trim();
      if (!trimmed) throw new Error('النص المدخل فارغ');

      if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
        const json = JSON.parse(trimmed);
        const list = Array.isArray(json) ? json : (Array.isArray(json.employees) ? json.employees : null);
        if (!list) throw new Error('ملف JSON لا يحتوي على قائمة موظفين صالحة');
        return {
          employees: list.map((item, idx) => ({
            id: item.id || `emp-imp-${Date.now()}-${idx}`,
            name: String(item.name || `موظف ${idx + 1}`),
            role: String(item.role || 'موظف'),
            law: normalizeLawId(item.law),
            department: String(item.department || 'عام'),
            hireDate: item.hireDate || '2023-01-01',
            basicSalary: Number(item.basicSalary) || 0,
            fixedAllowances: Number(item.fixedAllowances) || 0,
            annualLeaveEntitlement: Number(item.annualLeaveEntitlement) || 14,
            takenLeaveDays: Number(item.takenLeaveDays) || 0,
            note: String(item.note || ''),
            reminderTime: item.reminderTime || '08:30',
            reminderActive: item.reminderActive !== undefined ? Boolean(item.reminderActive) : true,
            lastNotifiedDate: ''
          })),
          settlement: json.settlement || null,
          leaveSim: json.leaveSim || null
        };
      }

      const lines = trimmed.split(/\r?\n/).filter((l) => l.trim().length > 0);
      if (lines.length < 2) throw new Error('ملف CSV يجب أن يحتوي على رأس جدول وصف بيانات واحد على الأقل');

      const splitCSVLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      };

      const headers = splitCSVLine(lines[0]).map((h) => h.replace(/^\uFEFF/, ''));
      const employees = lines.slice(1).map((line, idx) => {
        const cols = splitCSVLine(line);
        const rec = {};
        headers.forEach((h, i) => {
          rec[h] = cols[i] ?? '';
        });
        return {
          id: rec.id || `emp-csv-${Date.now()}-${idx}`,
          name: rec.name || `موظف ${idx + 1}`,
          role: rec.role || 'موظف',
          law: normalizeLawId(rec.law),
          department: rec.department || 'عام',
          hireDate: rec.hireDate || '2023-01-01',
          basicSalary: Number(rec.basicSalary) || 0,
          fixedAllowances: Number(rec.fixedAllowances) || 0,
          annualLeaveEntitlement: Number(rec.annualLeaveEntitlement) || 14,
          takenLeaveDays: Number(rec.takenLeaveDays) || 0,
          note: rec.note || '',
          reminderTime: rec.reminderTime || '08:30',
          reminderActive: true,
          lastNotifiedDate: ''
        };
      });

      return { employees, settlement: null, leaveSim: null };
    }

                type="button"
                onclick="exportWorkspaceJSON()"
                class="flex-1 py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold transition cursor-pointer"
              >
                ⬇️ تصدير نسخة JSON كاملة
              </button>
              <button
                type="button"
                onclick="exportEmployeesCSV()"
                class="flex-1 py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs sm:text-sm font-bold transition cursor-pointer"
              >
                📊 تصدير الموظفين CSV
              </button>
            </div>

            <div class="pt-4 border-t border-slate-100">
              <label class="block text-xs font-bold text-slate-700 mb-2">رفع ملف JSON أو CSV من جهازك</label>
              <input
                type="file"
                accept=".json,.csv,text/csv,application/json"
                onchange="handleFileUpload(event)"
                class="block w-full text-xs text-slate-600 file:ml-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer"
              />
            </div>
          </div>

          <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-extrabold text-slate-900">استيراد ولصق بيانات (JSON / CSV)</h2>
              <button
                type="button"
                onclick="fillSampleImportText()"
                class="text-xs font-bold text-brand-600 hover:underline cursor-pointer"
              >
                إدراج نموذج CSV جاهز
              </button>
            </div>

            <textarea
              rows="8"
              oninput="importDraftText = this.value"
              placeholder='الصق هنا بيانات JSON أو CSV مثل:
name,role,law,basicSalary,fixedAllowances,annualLeaveEntitlement,takenLeaveDays,note
رنا منصور,أخصائية موارد بشرية,jordan,600,100,14,4,مراجعة عقود العمل'
              class="w-full rounded-xl border border-slate-300 p-3 text-xs sm:text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-500"
            >${escapeHtml(importDraftText)}</textarea>

            <div class="flex justify-end">
              <button
                type="button"
                onclick="handleApplyPastedImport()"
                class="py-2.5 px-5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold transition cursor-pointer"
              >
                ✓ اعتماد وتحميل البيانات إلى المنصة
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function renderMorningReminderModal() {
      if (!state.morningAlertOpen) return '';
      const notes = getDueMorningNotes(true);

      return `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
          <div class="bg-white rounded-2xl border border-slate-200 max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div class="flex items-center gap-2.5">
                <span class="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center text-lg font-bold">⏰</span>
                <div>
                  <h3 class="text-base sm:text-lg font-extrabold text-slate-900">إيجاز الملاحظات الصباحية — 08:30 صباحاً</h3>
                  <p class="text-xs text-slate-500">تذكير يومي بملاحظات الموظفين المسجلة في المنصة</p>
                </div>
              </div>
              <button
                type="button"
                onclick="closeMorningAlert()"
                class="text-slate-400 hover:text-slate-700 text-lg font-bold px-2 cursor-pointer"
              >
                ✕
              </button>
            </div>

            <div class="max-h-72 overflow-y-auto space-y-2.5">
              ${notes.length === 0 ? `
                <div class="text-sm text-slate-500 text-center py-6">لا توجد ملاحظات تذكير نشطة حالياً. أضف ملاحظة لأي موظف من تبويب الموظفين.</div>
              ` : notes.map((emp) => {
                const empLaw = LAW_PROFILES[emp.law] || LAW_PROFILES.jordan;
                return `
                  <div class="rounded-xl border border-amber-200 bg-amber-50/60 p-3 space-y-1">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-extrabold text-slate-900">${escapeHtml(emp.name)}</span>
                      <span class="font-bold px-2 py-0.5 rounded-full border ${empLaw.badgeClass}">${empLaw.shortName} • ${escapeHtml(emp.reminderTime || '08:30')}</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${escapeHtml(emp.note)}</p>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="flex justify-end pt-2 border-t border-slate-100">
              <button
                type="button"
                onclick="closeMorningAlert()"
                class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold cursor-pointer"
              >
                تم الاطلاع
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const activeEl = document.activeElement;
      let focusState = null;
      if (activeEl && root.contains(activeEl) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName)) {
        const inputs = Array.from(root.querySelectorAll('input, textarea, select'));
        const index = inputs.indexOf(activeEl);
        if (index !== -1) {
          focusState = {
            index,
            tagName: activeEl.tagName,
            type: activeEl.type || '',
            selectionStart: typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null,
            selectionEnd: typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null
          };
        }
      }

      let tabContent = '';
      switch (state.activeTab) {
        case 'leaves':
          tabContent = renderLeavesTab();
          break;
        case 'employees':
          tabContent = renderEmployeesTab();
          break;
        case 'laws':
          tabContent = renderLawsTab();
          break;
        case 'io':
          tabContent = renderDataIOTab();
          break;
        case 'settlement':
        default:
          tabContent = renderSettlementTab();
          break;
      }

      const bannerHtml = statusBannerMessage ? `
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4 no-print">
          <div class="rounded-xl px-4 py-3 text-xs sm:text-sm font-bold flex items-center justify-between border ${
            statusBannerMessage.type === 'error'
              ? 'bg-rose-50 text-rose-800 border-rose-200'
              : 'bg-emerald-50 text-emerald-800 border-emerald-200'
          }">
            <span>${escapeHtml(statusBannerMessage.text)}</span>
            <button type="button" onclick="statusBannerMessage = null; render();" class="text-xs underline cursor-pointer">إغلاق</button>
          </div>
        </div>
      ` : '';

      root.innerHTML = `
        ${renderTopHeader()}
        ${bannerHtml}
        <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
          ${tabContent}
        </main>
        <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print">
          مُخلّص HR — منصة مستقلة لحساب المخالصات والإجازات ومتابعة الموظفين (الأردن • السعودية للسعوديين والأجانب • فلسطين)
        </footer>
        ${renderMorningReminderModal()}
      `;

      if (focusState) {
        const updatedInputs = Array.from(root.querySelectorAll('input, textarea, select'));
        const target = updatedInputs[focusState.index];
        if (target && target.tagName === focusState.tagName) {
          target.focus({ preventScroll: true });
          if (
            focusState.selectionStart !== null &&
            typeof target.setSelectionRange === 'function' &&
            target.type !== 'number' &&
            target.type !== 'date' &&
            target.type !== 'time'
          ) {
            try {
              target.setSelectionRange(focusState.selectionStart, focusState.selectionEnd);
            } catch (e) {
              // ignore
            }
          }
        }
      }
    }

    // ============================================================================
    // 7. EVENT HANDLERS
    // ============================================================================
    function handleSelectLaw(lawId) {
      if (!LAW_PROFILES[lawId]) return;
      state.activeLaw = lawId;
      state.settlement.law = lawId;
      const isSaudi = lawId === 'saudi_citizen' || lawId === 'saudi_expat';
      state.settlement.noticeDays = isSaudi ? 60 : 30;
      state.leaveSim.law = lawId;
      saveState();
      render();
    }

    function handleSelectTab(tabId) {
      state.activeTab = tabId;
      saveState();
      render();
    }

    function updateSettlementField(field, value) {
      state.settlement[field] = value;
      if (field === 'law' && LAW_PROFILES[value]) {
        state.activeLaw = value;
        const isSaudi = value === 'saudi_citizen' || value === 'saudi_expat';
        state.settlement.noticeDays = isSaudi ? 60 : 30;
        if (isSaudi && !state.settlement.terminationType.startsWith('qiwa_')) {
          state.settlement.terminationType = state.settlement.terminationType === 'resignation'
            ? 'qiwa_resignation'
            : (state.settlement.terminationType === 'gross_misconduct' ? 'qiwa_art80' : 'qiwa_art74_2');
        } else if (!isSaudi && state.settlement.terminationType.startsWith('qiwa_')) {
          state.settlement.terminationType = state.settlement.terminationType === 'qiwa_resignation'
            ? 'resignation'
            : (state.settlement.terminationType === 'qiwa_art80' ? 'gross_misconduct' : 'termination_without_cause');
        }
        saveState();
        render();
        return;
      }
      saveState();
      if (typeof value === 'boolean' || field === 'terminationType' || field === 'saudiContractType') {
        render();
      } else {
        refreshSettlementSummaryOnly();
      }
    }

    function handleResetSettlement() {
      state.settlement = getDefaultSettlement(state.activeLaw);
      saveState();
      render();
    }

    function handleLeaveLawChange(lawId) {
      state.leaveSim.law = lawId;
      state.activeLaw = lawId;
      saveState();
      render();
    }

    function updateLeaveField(field, value) {
      state.leaveSim[field] = value;
      saveState();
      if (field === 'currentMonth') {
        render();
      } else {
        refreshLeavesSummaryOnly();
      }
    }

    function handleAddEmployee(e) {
      e.preventDefault();
      if (!newEmployeeForm.name.trim()) return;

      const created = {
        id: `emp-${Date.now()}`,
        name: newEmployeeForm.name.trim(),
        role: newEmployeeForm.role.trim() || 'موظف',
        law: newEmployeeForm.law,
        department: newEmployeeForm.department.trim() || 'عام',
        hireDate: newEmployeeForm.hireDate || '2023-01-01',
        basicSalary: Number(newEmployeeForm.basicSalary) || 0,
        fixedAllowances: Number(newEmployeeForm.fixedAllowances) || 0,
        annualLeaveEntitlement: Number(newEmployeeForm.annualLeaveEntitlement) || 14,
        takenLeaveDays: Number(newEmployeeForm.takenLeaveDays) || 0,
        note: newEmployeeForm.note.trim(),
        reminderTime: newEmployeeForm.reminderTime || '08:30',
        reminderActive: true,
        lastNotifiedDate: ''
      };

      state.employees = [created, ...state.employees];
      newEmployeeForm = {
        ...newEmployeeForm,
        name: '',
        role: '',
        note: ''
      };
      saveState();
      setStatusBanner(`تمت إضافة الموظف "${created.name}" بنجاح.`);
    }

    function updateEmployeeNote(empId, noteVal) {
      state.employees = state.employees.map((emp) =>
        emp.id === empId ? { ...emp, note: noteVal, lastNotifiedDate: '' } : emp
      );
      saveState();
    }

    function updateEmployeeReminderTime(empId, timeVal) {
      state.employees = state.employees.map((emp) =>
        emp.id === empId ? { ...emp, reminderTime: timeVal || '08:30', lastNotifiedDate: '' } : emp
      );
      saveState();
      render();
    }

    function toggleEmployeeReminder(empId, checked) {
      state.employees = state.employees.map((emp) =>
        emp.id === empId ? { ...emp, reminderActive: checked } : emp
      );
      saveState();
      render();
    }

    function deleteEmployee(empId) {
      state.employees = state.employees.filter((emp) => emp.id !== empId);
      saveState();
      render();
    }

    function loadEmployeeIntoSettlement(empId) {
      const emp = state.employees.find((e) => e.id === empId);
      if (!emp) return;
      const leaveLeft = Math.max(0, (Number(emp.annualLeaveEntitlement) || 0) - (Number(emp.takenLeaveDays) || 0));
      const isSaudi = emp.law === 'saudi_citizen' || emp.law === 'saudi_expat';
      state.activeLaw = emp.law;
      state.settlement = {
        ...state.settlement,
        employeeName: emp.name,
        law: emp.law,
        hireDate: emp.hireDate || '2022-01-01',
        endDate: new Date().toISOString().slice(0, 10),
        basicSalary: Number(emp.basicSalary) || 0,
        fixedAllowances: Number(emp.fixedAllowances) || 0,
        remainingLeaveDays: leaveLeft,
        noticeDays: isSaudi ? 60 : 30
      };
      state.activeTab = 'settlement';
      saveState();
      render();
    }

    function handlePreviewMorningAlert() {
      state.morningAlertOpen = true;
      state.simulatedAlert = true;
      const notes = getDueMorningNotes(true);
      if (notes.length > 0) {
        triggerBrowserNotification(notes);
      }
      render();
    }

    function closeMorningAlert() {
      state.morningAlertOpen = false;
      state.simulatedAlert = false;
      render();
    }

    function handleRequestNotificationPermission() {
      if (!('Notification' in window)) {
        setStatusBanner('هذا المتصفح لا يدعم إشعارات النظام؛ ستعمل التنبيهات الصباحية داخل التطبيق الساعة 08:30.', 'error');
        return;
      }
      Notification.requestPermission().then((perm) => {
        if (perm === 'granted') {
          setStatusBanner('تم تفعيل إشعارات المتصفح لتنبيه الساعة 08:30 صباحاً.');
        } else {
          setStatusBanner('لم يتم منح إذن إشعارات المتصفح؛ يمكنك الاعتماد على نافذة التنبيه داخل التطبيق.', 'error');
        }
        render();
      }).catch(() => {
        render();
      });
    }

    function handleFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          importDraftText = String(reader.result || '');
          const parsed = parseImportedData(importDraftText);
          state.employees = parsed.employees;
          if (parsed.settlement) state.settlement = { ...state.settlement, ...parsed.settlement };
          if (parsed.leaveSim) state.leaveSim = { ...state.leaveSim, ...parsed.leaveSim };
          saveState();
          setStatusBanner(`تم تحميل ${parsed.employees.length} سجل موظف بنجاح من الملف.`);
        } catch (err) {
          setStatusBanner(`تعذر قراءة الملف: ${err.message}`, 'error');
        }
      };
      reader.readAsText(file);
    }

    function handleApplyPastedImport() {
      try {
        const parsed = parseImportedData(importDraftText);
        state.employees = parsed.employees;
        if (parsed.settlement) state.settlement = { ...state.settlement, ...parsed.settlement };
        if (parsed.leaveSim) state.leaveSim = { ...state.leaveSim, ...parsed.leaveSim };
        saveState();
        setStatusBanner(`تم استيراد ${parsed.employees.length} سجل موظف بنجاح.`);
      } catch (err) {
        setStatusBanner(`خطأ في صيغة البيانات: ${err.message}`, 'error');
      }
    }

    function fillSampleImportText() {
      importDraftText = [
        'name,role,law,basicSalary,fixedAllowances,annualLeaveEntitlement,takenLeaveDays,note',
        'رنا منصور,أخصائية موارد بشرية,jordan,600,100,14,4,متابعة تسجيل الضمان وتحديث ملف الموظف',
        'فيصل القحطاني,مدير مبيعات,saudi_citizen,9000,2000,21,7,مراجعة عمولات الربع الحالي وتصفية الإجازة'
      ].join('\n');
      render();
    }

    // ============================================================================
    // 8. INITIALIZATION & PERIODIC REMINDER CHECKER
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      render();
      checkScheduledReminders();
      setInterval(checkScheduledReminders, 30000);
    });
  </script>
</body>
</html>
